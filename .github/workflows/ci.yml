# CI — the five suites plus the README's graph shape (ADR-095).
#
# Jobs are independent so a red suite is named by its job. The graph
# job builds the sandbox image (~4 min; lane B runs only inside it,
# ADR-092/C-64) and is the first place the compiled invariant checkers
# execute outside a developer box (C-19).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read   # the graph job's base is the last green run (ADR-114)

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # two modules, neither at the root: without this the cache is never restored
          cache-dependency-path: |
            go/go.sum
            bench/oracle/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: gofmt
        run: test -z "$(gofmt -l go bench/oracle)" || { gofmt -l go bench/oracle; exit 1; }
      - name: go test (product)
        working-directory: go
        run: go test ./...
      - name: tsc oracle's pinned typescript (the TS cells run wherever node is, and the runner has node)
        working-directory: bench/oracle/ts
        run: npm ci
      - name: tsextract's ts-morph (the callee-shape helper under bench/oracle/shape reads it; its node suite skips without it)
        working-directory: tsextract
        run: npm ci
      - name: go test (oracle lane; Rust/Python cells skip without their toolchains)
        working-directory: bench/oracle
        run: go test ./...
      - name: static proxy builds
        working-directory: go
        run: CGO_ENABLED=0 go build -o ../sandbox/hobbes-proxy ./cmd/hobbes-proxy

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: tsextract helper (the Python suite shells out to it)
        working-directory: tsextract
        run: npm ci
      - name: pytest (lane B off by default; lane_b cases skip without the image)
        working-directory: pipeline
        run: uv sync && uv run pytest -q
      - name: atlas0 (the Atlas-0 instruments, bench tooling; numpy only)
        working-directory: bench/atlas0
        run: uv sync && uv run pytest -q
      - name: lattice (the Calvin experiments' E0 instruments, bench tooling; stdlib only)
        working-directory: bench/calvin/lattice
        run: uv sync && uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: web (vitest + build)
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: tsextract
        working-directory: tsextract
        run: npm ci && npm test
      - name: scip helper
        working-directory: scip
        run: npm ci && npm test

  graph:
    # ingest → lanes → compiled invariants → review, in the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `hobbes review` diffs against the base ref
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum   # this job builds the proxy only
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: helpers
        run: (cd tsextract && npm ci) && (cd scip && npm ci) && (cd pipeline && uv sync)
      - name: base ref
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "ref=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
          else
            # The last green run's commit, so a red review stays red until it
            # is fixed (ADR-114); the push's own before when there is none
            # in this history (the first run, a rewritten branch).
            green=$(gh run list --workflow ci.yml --branch "${{ github.ref_name }}" --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$green" ] && git merge-base --is-ancestor "$green" HEAD; then
              echo "reviewing from the last green run: $green"
              echo "ref=$green" >> "$GITHUB_OUTPUT"
            else
              echo "no green run in this history; reviewing from the push's before"
              echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: graph checks
        run: scripts/ci-graph.sh "${{ steps.base.outputs.ref }}"
