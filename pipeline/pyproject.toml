[project]
name = "hobbes"
version = "0.0.1"
description = "Hobbes CLI and ingestion pipeline: extractors, invariant compiler, and the front-end to the Go policy engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Max Marrujo" }]
# tree-sitter is pinned below 0.26: the 0.26.0 core segfaults during our
# walk of larger files (reproduced on this repo's own sources; 0.25.x is
# clean with the same code and grammar). Revisit the pin on a new release.
dependencies = [
    "pyyaml>=6",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-hcl>=1.2.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.23,<0.25",
]

[project.scripts]
hobbes = "hobbes.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=8",
    "semgrep>=1.173.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbes"]

# The benchmark session policy is data beside the code that reads it
# (ADR-057); keep it in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/hobbes/bench/bench.box.policy" = "hobbes/bench/bench.box.policy"

[tool.pytest.ini_options]
markers = ["lane_b: exercises lane B, which shells out to a SCIP indexer"]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
