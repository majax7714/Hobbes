id: I-2
statement: >-
  Artifacts under .hobbes/derived/ are regenerable pipeline output and are
  never committed. The repo policy denies `git add` of that path, ingest
  writes the gitignore entry, and provenance lives in the SHA stamp rather
  than in version control.
scope: .hobbes/derived
status: confirmed
