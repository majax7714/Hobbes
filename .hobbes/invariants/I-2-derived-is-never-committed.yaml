id: I-2
statement: >-
  Artifacts under .hobbes/derived/ are regenerable pipeline output and are
  never committed. The repo policy denies `git add` of that path, ingest
  ensures git ignores it (a `.gitignore` line here; a target clone's
  `.git/info/exclude` since ADR-012's 2026-10-03 amendment), and provenance
  lives in the SHA stamp rather than in version control.
scope: .hobbes/derived
status: confirmed
# Soft: the claim is about what git tracks, which none of the four
# targets can see.
check: soft
