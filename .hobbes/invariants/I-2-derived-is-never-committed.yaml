  - pipeline/tests/test_emit.py::TestEnsureHobbesIgnored::test_target_repo_gets_whole_dir_excluded
  - pipeline/tests/test_emit.py::TestEnsureHobbesIgnored::test_tracked_hobbes_content_is_respected
