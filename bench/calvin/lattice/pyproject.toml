[project]
name = "lattice"
version = "0.0.1"
description = "The Calvin experiments' E0 instruments: sqlite-vector's SIMD kernel lattice, its holes and its graders (docs/calvin/calvin-experiments.md, ADR-151). Bench tooling, never product."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Max Marrujo" }]
dependencies = []

[project.scripts]
lattice = "lattice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
