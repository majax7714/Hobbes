[project]
name = "atlas0"
version = "0.0.1"
description = "Atlas-0 — sparse is not absent: the synthetic world, the act scorer and the probe harness (docs/atlas0/atlas-0.md). Bench tooling, never product."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Max Marrujo" }]
dependencies = ["numpy>=2"]

[project.scripts]
atlas0 = "atlas0.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Steps 3–4 (training the blocks, `atlas0.train`) need torch. It is a
# group, not a dependency of the instruments: `uv sync --group train`
# pulls the CPU wheel for the smoke test; the Modal image installs the
# CUDA build (`scripts/modal_atlas0.py`).
train = ["torch>=2.8"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
