// Gradle init script attaching the HobbesOracle javac plugin to every
// JavaCompile task (the Gradle half of javac-oracle.py). A toolchain
// forbids forkOptions.executable, so the plugin rides the processor path
// and the export the plugin needs rides the forked compiler JVM's args.
//   ./gradlew --init-script hobbes-oracle.gradle clean compileTestJava
allprojects {
    tasks.withType(JavaCompile).configureEach {
        def jar = files(System.getenv('HOBBES_ORACLE_JAR'))
        options.fork = true
        options.forkOptions.jvmArgs += ['--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                                        '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED']
        options.compilerArgs += ['-Xplugin:HobbesOracle']
        options.annotationProcessorPath = jar + (options.annotationProcessorPath ?: files())
    }
}
