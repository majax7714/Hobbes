<title>date-fns/date-fns: call-site capture per directory before and after C-74 and C-90 (lifted 2026-09-03)</title>
<rect width="820" height="542" fill="#fcfcfb"/>
<text x="24" y="30" font-size="15" fill="#1a1a19" text-anchor="start" font-weight="bold" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >date-fns/date-fns @ 18cbd436 — capture per directory, before and after C-74 and C-90 (lifted 2026-09-03)</text>
<text x="24" y="50" font-size="11" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >A pnpm workspace: every package's tsconfig extends one reached through a node_modules symlink. Before the lift the link dangled inside</text>
<text x="24" y="65" font-size="11" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the sandbox, scip-typescript failed on every zone (TS6053), and the whole repo fell to lane A's syntactic floor. The per-directory view</text>
<text x="24" y="80" font-size="11" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >is what named the fix.</text>
<text x="24" y="97" font-size="10" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Before: Hobbes at 55622713; after: Hobbes at 3319a193. Same clone, same commit, both ingests contained. Bar = accounted sites / detected call sites, as `hobbes ingest` prints it.</text>
