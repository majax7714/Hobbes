<line x1="24" y1="401" x2="796" y2="401" stroke="#d9d8d2"/>
<text x="24" y="421" font-size="11" fill="#1a1a19" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Same repo, same commit, two Hobbes builds. Before: the contained ingest could not follow the workspace link, so lane B answered</text>
<text x="24" y="436" font-size="11" fill="#1a1a19" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >nowhere and capture read 0.1% — a number the per-directory view exposed as one failure repeated per zone, not fifteen small ones.</text>
<text x="24" y="451" font-size="11" fill="#1a1a19" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >After C-74 (workspace node_modules links mount their targets, and an indexer's exit is told from the helper's) and C-90 (a zone's</text>
<text x="24" y="466" font-size="11" fill="#1a1a19" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >stage carries every config its tsconfig names), fifteen of fifteen zones index. Every workspace-aware tool meets this shape; the</text>
<text x="24" y="481" font-size="11" fill="#1a1a19" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >point of the picture is that the failure was visible per directory before it was fixed.</text>
<text x="24" y="500" font-size="10" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Capture is lane A's count of detected call sites the join accounted for — a coverage number, not precision; the semantic edges are graded separately</text>
<text x="24" y="513" font-size="10" fill="#5a5a57" text-anchor="start" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >(docs/oracle/cells/). Rendered from two graph.json artifacts by bench/oracle/report/render.py (ADR-102).</text>
</svg>
